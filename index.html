<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="./index/index.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crystal Clicker</title>
</head>
<body>
    <div class="game-container">
        <header class="game-header">
            <h1 class="game-title">Crystal Clicker</h1>
            <div class="score-board">
                Crystals: <span id="crystal-count">0</span>
            </div>
        </header>

        <main class="game-main">
            <div class="clicker-area">
                <img src="./imgs/Crystal-final.png" alt="Crystal" id="crystal-img" class="pixel-art clickable">
            </div>
            
            <div class="shop-area">
                <a href="./shop/shop.html">
                <button id="shop-button" class="pixel-art shop-btn">
                    <img src="./imgs/shop.png" alt="Shop">
                </button>
                </a>
            </div>
        </main>
    </div>
    <script src="./index/index.js"></script>
</body>
</html>
